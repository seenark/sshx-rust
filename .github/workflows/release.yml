# .github/workflows/release.yml
# Triggers on: push of tag v*.*.*

name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            builder: cargo
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            builder: cargo
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            builder: cross
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            builder: cross
            archive: tar.gz
          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest
          #   builder: cargo
          #   archive: zip

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --locked

      - name: Build with cargo
        if: matrix.builder == 'cargo'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build with cross
        if: matrix.builder == 'cross'
        run: cross build --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE=sshx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          tar czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" sshx
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $Archive = "sshx-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Remove-Item -Recurse -Force staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/sshx.exe" "staging/sshx.exe"
          Compress-Archive -Path "staging/sshx.exe" -DestinationPath $Archive -Force
          "ARCHIVE=$Archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
          generate_release_notes: true
