[package]
name = "sshx"
version = "0.1.0"
edition = "2024"
description = "Enhanced SSH connection manager with fuzzy selection and tunnel support"

[[bin]]
name = "sshx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
skim = "0.11"
fuzzy-matcher = "0.3"
dialoguer = "0.11"
console = "0.15"
which = "7"
dirs = "6"
shell-words = "1"
glob = "0.3"
shellexpand = "3"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
